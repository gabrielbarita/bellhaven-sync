# Runs the pipeline every morning. It only PROPOSES changes -
# nothing is written to the CRM until a reviewer approves it in app.py.
name: bellhaven-daily-sync

on:
  schedule:
    - cron: "0 13 * * *"      # 13:00 UTC = 6:00 AM Pacific, daily
  workflow_dispatch: {}        # "Run workflow" button for manual runs

permissions:
  contents: write              # needed to commit the updated proposals database

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Scrape website and generate proposals
        env:
          CRM_TOKEN: ${{ secrets.CRM_TOKEN }}
        run: python match.py --scrape
      # pipeline.db remembers every decision, so tomorrow's run won't
      # re-propose anything already approved or rejected.
      - name: Save proposal state
        run: |
          git config user.name "bellhaven-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/pipeline.db data/locations.json
          git commit -m "Daily sync $(date -u +%F)" || echo "No changes"
          git push
